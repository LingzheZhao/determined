---
name: "Lint bindings"

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/*'
  push:
    branches:
      - 'main'
      - 'releases/**'

jobs:
  build-proto:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Setup Protoc
        uses: arduino/setup-protoc@v2
        with:
          version: '24.3'
      - name: Install dependencies
        run: |
          make -C proto get-deps
          make -C master get-deps
          make -C agent get-deps
      - name: Build
        run: make -C proto build
      - uses: actions/upload-artifact@v4
        with:
          name: proto
          path: proto/build/
          retention-days: 1

  lint-py-bindings:
    needs:
      - build-proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proto
          path: proto/build/
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run checks
        run: |
          make -C bindings force-gen
          make -C bindings check/python

  lint-ts-bindings:
    needs:
      - build-proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proto
          path: proto/build/
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bindings/requirements.txt
      - name: Install generator dependencies
        run: python -m pip install -r bindings/requirements.txt
      - name: Run checks
        run: |
          make -C bindings force-gen
          make -C bindings check/typescript
