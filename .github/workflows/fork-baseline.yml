---
name: Fork baseline

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-build-and-test:
    name: Go build and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DET_INTEGRATION_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/determined?sslmode=disable
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: determined
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d determined"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache-dependency-path: go.sum
      - name: Set candidate version
        run: echo "VERSION=0.38.1+fork.${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Build master and agent
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p build
          go build -trimpath \
            -ldflags "-X github.com/determined-ai/determined/master/version.Version=${VERSION}" \
            -o build/determined-master \
            ./master/cmd/determined-master
          go build -trimpath \
            -ldflags "-X main.version=${VERSION}" \
            -o build/determined-agent \
            ./agent/cmd/determined-agent
          printf 'version=%s\ncommit=%s\ngo=%s\n' \
            "$VERSION" "$GITHUB_SHA" "$(go version)" > build/BUILD-INFO.txt
          (cd build && sha256sum determined-master determined-agent > SHA256SUMS)
          tar -czf build/determined-fork-linux-amd64.tar.gz -C build \
            determined-master determined-agent BUILD-INFO.txt SHA256SUMS
      - name: Run focused Go unit tests
        run: |
          go test ./master/internal/command \
            -run '^TestCanControlGenericTaskBasic$' \
            -count=1
          go test ./master/pkg/archive ./master/pkg/checkpoints/archive
      - name: Generate integration-test mocks
        working-directory: master
        run: go run github.com/vektra/mockery/v2@v2.42.0
      - name: Run generic-task authorization integration tests
        working-directory: master
        run: |
          go test -race -tags=integration ./internal \
            -run '^(TestPropagateTaskState|TestFindRoot|TestSetTaskStatesOnlyAffectsAuthorizedSnapshot|TestGetTaskChildren|TestGenericTaskMutationsRequireControlAuthorization|TestKillGenericTaskAuthorizesRootTreeBeforeMutation|TestPauseAndUnpauseAuthorizeDescendantsBeforeMutation|TestGenericTaskMutationHidesTaskWithoutViewAuthorization)$' \
            -count=1
      - name: Upload candidate binaries
        uses: actions/upload-artifact@v4
        with:
          name: determined-fork-linux-amd64
          path: build/determined-fork-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  harness-wheel:
    name: Build harness wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: harness/pyproject.toml
      - name: Set candidate version
        run: echo "VERSION=0.38.1+fork.${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Build wheel
        working-directory: harness
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: determined-fork-harness-wheel
          path: harness/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  python-archive-safety:
    name: Archive safety (Python ${{ matrix.python-version }})
    needs: harness-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: harness/pyproject.toml
      - name: Download harness wheel
        uses: actions/download-artifact@v4
        with:
          name: determined-fork-harness-wheel
          path: harness/dist
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=6.0.1,<8' 'responses!=0.23.2'
          python -m pip install \
            --target "$RUNNER_TEMP/determined-wheel" \
            harness/dist/*.whl
      - name: Verify tests import the wheel
        env:
          PYTHONPATH: ${{ runner.temp }}/determined-wheel
        run: |
          python -c 'import os, pathlib, determined; target = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "determined-wheel").resolve(); imported = pathlib.Path(determined.__file__).resolve(); assert target in imported.parents, f"expected {target}, imported {imported}"; print(f"testing {imported}")'
      - name: Run archive safety tests
        env:
          PYTHONPATH: ${{ runner.temp }}/determined-wheel
        run: |
          python -m pytest -q --import-mode=importlib \
            harness/tests/common/test_tarfile_utils.py \
            harness/tests/checkpoints/test_checkpoint.py \
            harness/tests/exec/test_prep_container.py
