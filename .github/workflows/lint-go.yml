---
name: "Lint go"

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/*'
      - 'webui/*'
  push:
    branches:
      - 'main'
      - 'releases/**'

jobs:
  lint-go:
    strategy:
      fail-fast: true
      matrix:
        service: [agent, master, proto]
    runs-on: ubuntu-latest
    env:
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Setup Protoc
        uses: arduino/setup-protoc@v2
        with:
          version: '24.3'
      - name: Install dependencies
        run: |
          make -C proto get-deps
          sudo apt-get update && sudo apt-get install -y clang-format
          make -C ${{ matrix.service }} get-deps
      - name: Generate integration-test mocks
        if: matrix.service == 'agent'
        working-directory: master
        run: go run github.com/vektra/mockery/v2@v2.42.0
      - name: Run checks
        run: |
          make -C proto build
          make -C ${{ matrix.service }} check
