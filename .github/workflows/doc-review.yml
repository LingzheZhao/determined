---
name: "auto-assign on doc PRs opened by doc team"

on:  # yamllint disable-line rule:truthy
  pull_request_target:
      types:
        - opened
        - reopened
        - synchronize
      paths:
        - 'docs/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  docpr:
    # This integration depends on the upstream organization's private services.
    if: github.repository == 'determined-ai/determined'
    runs-on: ubuntu-latest
    steps:
      - uses: dannysauer/actions-assigner@v2
        with:
          token: ${{ secrets.DETERMINED_TOKEN }}
          team-reviewers: docs
