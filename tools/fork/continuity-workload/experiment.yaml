name: fork-continuity-cpu-baseline
description: NumPy/Core API workload for observing process and control-plane continuity
entrypoint: python3 -u train.py

environment:
  image: determined-fork-cpu-task:local
  environment_variables:
    cpu:
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1

resources:
  resource_pool: default
  slots_per_trial: 1

hyperparameters:
  steps: 180
  step_seconds: 1.0
  checkpoint_step: 15
  metrics_every: 5
  learning_rate: 0.02
  report_progress: true

searcher:
  name: single
  metric: loss
  smaller_is_better: true

max_restarts: 0
